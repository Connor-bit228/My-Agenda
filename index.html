<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Agenda">
<meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EF;--surf:#FFFFFF;--surf2:#F0EDE8;--surf3:#E8E4DC;
  --txt:#1A1A1A;--txt2:#4A4845;--muted:#8A8580;
  --bdr:#E8E3DB;--bdr2:#D8D3CB;
  --acc:#2D6A4F;--acc-l:#D8EFE3;--acc-m:#74C69D;
  --blue:#4A90D9;--blue-l:rgba(74,144,217,0.13);
  --red:#C1666B;--hol:#B8956A;--hol-l:#F5EDE0;
  --past-bg:#E4E0D8;
  --shd:0 2px 10px rgba(0,0,0,0.06);--shd-lg:0 8px 28px rgba(0,0,0,0.1);
  --r:12px;--rs:8px;--t:0.2s ease;
}
body.dark{
  --bg:#0E0E14;--surf:#1A1A24;--surf2:#22222E;--surf3:#2A2A3A;
  --txt:#E4E2DE;--txt2:#B8B6B2;--muted:#6A6875;
  --bdr:#2A2A38;--bdr2:#343444;
  --acc:#52B788;--acc-l:#1A3020;--acc-m:#2D6A4F;
  --blue:#5BA4E8;--blue-l:rgba(91,164,232,0.15);
  --red:#D9797E;--hol:#C4A07A;--hol-l:#2A2018;
  --past-bg:#10101A;
  --shd:0 2px 10px rgba(0,0,0,0.3);--shd-lg:0 8px 28px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{overscroll-behavior-y:none;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);overscroll-behavior-y:none;color:var(--txt);min-height:100vh;display:flex;flex-direction:column;transition:background var(--t),color var(--t);}

/* HEADER */
header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:max(11px,env(safe-area-inset-top)) 22px 11px;display:flex;align-items:center;gap:8px;box-shadow:var(--shd);flex-wrap:wrap;position:sticky;top:0;z-index:50;transition:background var(--t),border-color var(--t);}
.logo{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--acc);letter-spacing:-0.02em;flex-shrink:0;}
.wx{display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--bdr);border-radius:18px;padding:3px 10px;font-size:0.75rem;color:var(--txt2);}
.sync-row{display:flex;align-items:center;gap:4px;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--bdr);}
.sdot.ok{background:#52b788;}.sdot.busy{background:#C8A800;animation:pulse 1s infinite;}.sdot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.stxt{font-size:0.65rem;color:var(--muted);}
.vtabs{display:flex;gap:2px;background:var(--surf2);border-radius:9px;padding:3px;border:1px solid var(--bdr);}
.vt{padding:4px 12px;border-radius:6px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:0.73rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all var(--t);touch-action:manipulation;white-space:nowrap;}
.vt.on{background:var(--surf);color:var(--acc);box-shadow:var(--shd);}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{background:var(--surf2);border:1px solid var(--bdr);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.95rem;display:flex;align-items:center;justify-content:center;transition:all var(--t);color:var(--txt2);touch-action:manipulation;}
.icon-btn:hover{background:var(--acc-l);color:var(--acc);}
.leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:3px;font-size:0.65rem;color:var(--muted);}
.ld{width:7px;height:7px;border-radius:50%;}

/* LAYOUT */
.app{display:flex;flex:1;min-height:0;}
.main{flex:1;padding:18px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0;}

/* CAL HEADER */
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ch-lbl{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--txt);letter-spacing:-0.03em;}
.ch-yr{font-size:0.85rem;color:var(--muted);font-weight:300;margin-left:6px;}
.ch-nav{display:flex;gap:5px;align-items:center;}
.nb{background:var(--surf);border:1px solid var(--bdr);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:0.95rem;display:flex;align-items:center;justify-content:center;transition:all var(--t);color:var(--txt);touch-action:manipulation;}
.nb:hover{background:var(--acc);color:white;border-color:var(--acc);}
.tb{background:var(--surf);border:1px solid var(--bdr);padding:4px 12px;border-radius:16px;cursor:pointer;font-size:0.73rem;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--muted);transition:all var(--t);touch-action:manipulation;}
.tb:hover{background:var(--acc-l);color:var(--acc);}

/* WEEKDAY HEADERS */
.wds{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.wd{text-align:center;font-size:0.64rem;font-weight:600;color:var(--muted);padding:3px 0;letter-spacing:0.06em;text-transform:uppercase;}
.wd.we{color:var(--red);opacity:0.75;}

/* MONTH GRID — equal fixed-height cells */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:110px;gap:3px;}
.dc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rs);padding:7px 6px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s,background 0.15s;display:flex;flex-direction:column;gap:2px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.dc.oth{opacity:0.22;}
.dc.past{background:var(--past-bg);border-color:color-mix(in srgb,var(--bdr) 60%,var(--past-bg));}
.dc.past .dn{color:var(--muted);}
.dc.past .ep{opacity:0.4;}
.dc.past:hover{border-color:var(--bdr2);box-shadow:none;}
.dc.tod{border:2px solid var(--blue);box-shadow:var(--blue-l) 0 0 0 3px;}
.dc.tod .dn{color:var(--blue);font-weight:700;}
.dc.sel:not(.tod){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l);}
.dc.hd{border-left:3px solid var(--hol);}
.dc.we:not(.tod) .dn{color:var(--red);}
.dc.past.we .dn{color:color-mix(in srgb,var(--red) 40%,var(--muted));}
.dn{font-size:0.78rem;font-weight:500;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;}
.hml{font-size:0.52rem;color:var(--hol);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
.ep{font-size:0.6rem;border-radius:3px;padding:1px 4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:var(--ecl,var(--acc-l));color:var(--ec,var(--acc));border-left:2px solid var(--ec,var(--acc));pointer-events:none;line-height:1.4;}
.em{font-size:0.56rem;color:var(--muted);padding-left:2px;pointer-events:none;}
.edots{display:none;gap:2px;margin-top:2px;flex-wrap:wrap;pointer-events:none;}
.edot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* YEAR VIEW */
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.mm{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:10px;cursor:pointer;transition:all var(--t);touch-action:manipulation;}
.mm:hover{border-color:var(--acc-m);box-shadow:var(--shd);}
.mm-t{font-family:'Playfair Display',serif;font-size:0.78rem;font-weight:600;text-align:center;margin-bottom:6px;pointer-events:none;}
.mm-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
.mw{text-align:center;font-size:0.48rem;color:var(--muted);}
.mdays{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.md{text-align:center;font-size:0.55rem;padding:2px 0;border-radius:2px;line-height:1.7;cursor:pointer;touch-action:manipulation;}
.md.om{color:transparent;pointer-events:none;}.md.past{color:var(--muted);}
.md.tod{color:var(--blue);font-weight:700;}.md.hd2{color:var(--hol);}
.md.we{color:var(--red);}.md.past.we{color:color-mix(in srgb,var(--red) 35%,var(--muted));}
.md.has::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:var(--acc-m);margin:0 auto;margin-top:-2px;}

/* WEEK VIEW — equal fixed-height cards */
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:210px;gap:5px;}
.wc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 7px;cursor:pointer;transition:all var(--t);display:flex;flex-direction:column;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.wc:hover:not(.tod){border-color:var(--acc-m);box-shadow:var(--shd);transform:translateY(-2px);}
.wc.past{background:var(--past-bg);}
.wc.past:hover{transform:none;box-shadow:none;border-color:var(--bdr);}
.wc.tod{border:2px solid var(--blue);box-shadow:var(--blue-l) 0 0 0 3px;}
.wc.sel:not(.tod){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l);}
.wc.hd{border-left:3px solid var(--hol);}
.wc-day{font-size:0.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;pointer-events:none;}
.wc-num{font-size:1.2rem;font-weight:700;color:var(--txt);line-height:1.1;pointer-events:none;}
.wc.tod .wc-num{color:var(--blue);}.wc.past .wc-num{color:var(--muted);}
.wc.we .wc-num{color:var(--red);}.wc.past.we .wc-num{color:color-mix(in srgb,var(--red) 40%,var(--muted));}
.wc-hd{font-size:0.54rem;color:var(--hol);pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wc-evs{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:5px;flex:1;overflow:hidden;pointer-events:none;}
.wc-ev{font-size:0.58rem;border-radius:3px;padding:2px 5px;font-weight:500;background:var(--ecl,var(--acc-l));color:var(--ec,var(--acc));border-left:2px solid var(--ec,var(--acc));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;align-self:stretch;}
.wc-ev-t{font-size:0.54rem;opacity:0.7;}
.wc-more{font-size:0.55rem;color:var(--muted);}
.wc-empty{font-size:0.58rem;color:var(--muted);font-style:italic;}

/* WEEK DAY DETAIL */
.dd{margin-top:12px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 18px;}
.dd-t{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:600;color:var(--txt);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.dd-hbadge{font-size:0.66rem;color:var(--hol);border-radius:4px;padding:2px 6px;border:1px solid var(--hol-l);background:var(--hol-l);}
.tl{display:flex;flex-direction:column;}
.tl-r{display:flex;align-items:stretch;min-height:36px;}
.tl-t{width:50px;font-size:0.6rem;color:var(--muted);padding-top:4px;text-align:right;padding-right:9px;flex-shrink:0;}
.tl-ln{width:1px;background:var(--bdr);flex-shrink:0;position:relative;}
.tl-ln::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--bdr);position:absolute;top:4px;left:-2px;}
.tl-b{flex:1;padding:2px 0 5px 11px;}
.tl-ev{background:var(--ecl,var(--acc-l));color:var(--ec,var(--acc));border-left:3px solid var(--ec,var(--acc));border-radius:4px;padding:4px 7px;margin-bottom:3px;font-size:0.7rem;}
.tl-ev-t{font-weight:600;}.tl-ev-n{font-size:0.62rem;opacity:0.7;margin-top:1px;}
.no-ev{font-size:0.74rem;color:var(--muted);font-style:italic;padding:5px 0;}

/* AGENDA VIEW */
.ag-grp{margin-bottom:2px;}
.ag-date{font-size:0.8rem;font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:0.06em;padding:14px 0 5px;display:flex;align-items:center;gap:8px;}
.ag-date::after{content:'';flex:1;height:1px;background:var(--bdr);}
.ag-date.todlbl{color:var(--blue);}
.ag-hbadge{font-size:0.6rem;color:var(--hol);background:var(--hol-l);border-radius:4px;padding:1px 6px;font-weight:500;}
.ag-ev{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rs);padding:8px 11px;display:flex;align-items:center;gap:9px;margin-bottom:4px;cursor:pointer;transition:all var(--t);border-left:4px solid var(--ec,var(--acc));touch-action:manipulation;max-width:520px;}
.ag-ev:hover{box-shadow:var(--shd);transform:translateX(2px);}
.ag-ev-time{font-size:0.68rem;color:var(--muted);min-width:54px;font-weight:500;flex-shrink:0;}
.ag-ev-info{flex:1;min-width:0;}
.ag-ev-title{font-size:0.83rem;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-ev-note{font-size:0.67rem;color:var(--muted);}
.ag-ev-badge{font-size:0.58rem;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--ecl,var(--acc-l));color:var(--ec,var(--acc));white-space:nowrap;flex-shrink:0;}
.ag-recur{font-size:0.58rem;color:var(--blue);background:var(--blue-l);border-radius:3px;padding:1px 4px;margin-left:4px;}

/* COUNTDOWNS */
.cd-sec{margin-bottom:18px;max-width:620px;}
.cd-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cd-hdr-t{font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
.cd-add{background:var(--acc);color:white;border:none;padding:4px 12px;border-radius:7px;font-size:0.7rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation;}
.cd-list{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;}
.cd-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:10px;}
.cd-emoji{font-size:1.4rem;flex-shrink:0;}
.cd-info{flex:1;min-width:0;}
.cd-name{font-size:0.85rem;font-weight:600;color:var(--txt);margin-bottom:3px;}
.cd-days{font-size:1.3rem;font-weight:700;color:var(--acc);line-height:1;}
.cd-days span{font-size:0.68rem;font-weight:400;color:var(--muted);margin-left:3px;}
.cd-bar-w{height:4px;background:var(--bdr);border-radius:2px;margin-top:5px;}
.cd-bar{height:100%;border-radius:2px;background:var(--acc);transition:width 0.5s;}
.cd-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:4px;touch-action:manipulation;flex-shrink:0;}
.cd-del:hover{color:var(--red);}
.cd-form{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:8px;}
.cd-form input,.cd-form select{width:100%;padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:0.8rem;color:var(--txt);background:var(--surf);outline:none;-webkit-appearance:none;appearance:none;}
.cd-form input:focus,.cd-form select:focus{border-color:var(--acc);}
.cd-row{display:flex;gap:7px;}
.cd-row>*{flex:1;}
.cd-btns{display:flex;gap:7px;}
.cd-save{flex:1;background:var(--acc);color:white;border:none;padding:9px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;touch-action:manipulation;}
.cd-cancel{background:var(--surf);color:var(--muted);border:1px solid var(--bdr);padding:9px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:0.8rem;cursor:pointer;touch-action:manipulation;}
.cd-empty{font-size:0.75rem;color:var(--muted);padding:4px 0 10px;}
.cd-hdr-t{white-space:nowrap;}
.cd-past-h{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 7px;padding-top:11px;border-top:1px solid var(--bdr);}
.cd-past .cd-card{background:var(--surf2);}
.cd-past .cd-name{color:var(--txt2);}
.cd-past-d{font-size:0.72rem;color:var(--muted);}

/* PLANNER */
.pl-wrap{display:flex;flex-direction:column;gap:13px;max-width:640px;}
.pl-sum{font-size:0.74rem;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;}
.pl-sum b{color:var(--txt);font-weight:600;}
.pl-carry{background:var(--blue-l);border:1px solid var(--blue);color:var(--blue);border-radius:9px;padding:10px 12px;font-size:0.76rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:left;touch-action:manipulation;}
.pl-tpls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pl-tpls-lbl{font-size:0.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;width:100%;}
.pl-tpl{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:7px 11px;font-size:0.73rem;color:var(--txt2);cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation;}
.pl-tpl:hover{border-color:var(--acc);color:var(--acc);}
.pl-tpl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pl-tpl-x{background:none;border:none;color:var(--muted);font-size:0.95rem;line-height:1;cursor:pointer;padding:0 0 0 2px;}
.pl-tpl-x:hover{color:var(--red);}
.pl-newbtn{background:var(--acc);color:white;border:none;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:600;cursor:pointer;touch-action:manipulation;}
.pl-newbtn:active{transform:scale(0.98);}
.pl-list{display:flex;flex-direction:column;}
.pl-blk{background:var(--surf);border:1px solid var(--bdr);border-left:4px solid var(--ec,var(--acc));border-radius:10px;padding:9px 10px;display:flex;align-items:center;gap:9px;transition:opacity var(--t),box-shadow var(--t);}
.pl-blk.dragging{opacity:0.35;}
.pl-blk.over{box-shadow:0 -3px 0 0 var(--acc);}
.pl-blk.done{opacity:0.5;}
.pl-blk.now{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l);}
.pl-chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--bdr2);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.82rem;color:white;touch-action:manipulation;}
.pl-chk.on{background:var(--acc);border-color:var(--acc);}
.pl-time{font-size:0.71rem;color:var(--muted);font-weight:600;min-width:82px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.pl-info{flex:1;min-width:0;cursor:pointer;}
.pl-title{font-size:0.87rem;font-weight:600;color:var(--txt);word-break:break-word;line-height:1.3;}
.pl-blk.done .pl-title{text-decoration:line-through;}
.pl-dur{font-size:0.66rem;color:var(--muted);margin-top:1px;}
.pl-acts{display:flex;align-items:center;gap:1px;flex-shrink:0;}
.pl-act{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;min-width:30px;height:38px;border-radius:6px;line-height:1;touch-action:manipulation;font-family:'DM Sans',sans-serif;}
.pl-act:hover{background:var(--surf2);color:var(--acc);}
.pl-act:disabled{opacity:0.25;cursor:default;}
.pl-act.del:hover{color:var(--red);background:var(--surf2);}
.pl-gap{font-size:0.65rem;color:var(--muted);padding:4px 0 4px 15px;display:flex;align-items:center;gap:8px;}
.pl-gap::before{content:'';width:2px;height:15px;background:var(--bdr);border-radius:1px;}
.pl-sep{height:5px;}
.pl-empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:0.84rem;line-height:1.65;}
.pl-empty em{display:block;font-size:1.7rem;margin-bottom:8px;font-style:normal;}
.pl-form{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px;}
.pl-form input{width:100%;padding:11px;border:1px solid var(--bdr);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.86rem;color:var(--txt);background:var(--surf2);outline:none;-webkit-appearance:none;appearance:none;}
.pl-form input:focus{border-color:var(--acc);}
.pl-lbl{font-size:0.7rem;color:var(--muted);font-weight:600;}
.pl-r2{display:flex;gap:8px;align-items:flex-end;}
.pl-r2>*{flex:1;}
.pl-durs{display:flex;gap:5px;flex-wrap:wrap;}
.pl-durb{background:var(--surf2);border:1px solid var(--bdr);border-radius:7px;padding:8px 11px;font-size:0.73rem;color:var(--txt2);cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation;}
.pl-durb.on{background:var(--acc-l);border-color:var(--acc);color:var(--acc);font-weight:700;}
.pl-clr{display:flex;gap:9px;flex-wrap:wrap;}
.pl-cs{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all var(--t);touch-action:manipulation;}
.pl-cs.on{border-color:var(--txt);transform:scale(1.12);}
.pl-tplchk{display:flex;align-items:center;gap:9px;font-size:0.76rem;color:var(--txt2);cursor:pointer;min-height:40px;}
.pl-tplchk input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px;height:20px;min-width:20px;flex-shrink:0;padding:0;margin:0;accent-color:var(--acc);background:none;border:none;border-radius:0;}
.pl-btns{display:flex;gap:8px;}
.pl-save{flex:1;background:var(--acc);color:white;border:none;padding:12px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:600;cursor:pointer;touch-action:manipulation;}
.pl-cancel{background:var(--surf2);color:var(--muted);border:1px solid var(--bdr);padding:12px 16px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.86rem;cursor:pointer;touch-action:manipulation;}
.sh-add-ev{background:var(--acc);color:white;border:none;padding:13px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;touch-action:manipulation;width:100%;margin-top:6px;}

/* SIDEBAR */
.sb{width:280px;background:var(--surf);border-left:1px solid var(--bdr);padding:18px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;transition:background var(--t);}
.sb-h{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:600;color:var(--txt);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--bdr);}
.sb-lbl{font-size:0.72rem;color:var(--muted);margin-bottom:7px;}
.sb-form{display:flex;flex-direction:column;gap:7px;position:relative;}
.sb-form input,.sb-form textarea,.sb-form select{width:100%;padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:0.8rem;color:var(--txt);background:var(--surf2);outline:none;transition:border-color var(--t);-webkit-appearance:none;appearance:none;}
.sb-form input:focus,.sb-form textarea:focus,.sb-form select:focus{border-color:var(--acc);}
.sb-form textarea{resize:none;height:48px;}
.r2{display:flex;gap:6px;}
.r2>*{flex:1;}
.eb-btn{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--rs);padding:0 9px;cursor:pointer;font-size:0.95rem;touch-action:manipulation;}
.ep-pop{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:8px;box-shadow:var(--shd-lg);z-index:300;}
.ep-pop.open{display:block;}
.ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
.ep-e{font-size:1rem;cursor:pointer;text-align:center;padding:4px;border-radius:4px;transition:background 0.1s;touch-action:manipulation;}
.ep-e:hover{background:var(--surf2);}
.clr-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.clr-lbl{font-size:0.68rem;color:var(--muted);width:100%;}
.csc{width:22px;height:22px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all var(--t);touch-action:manipulation;position:relative;}
.csc.on{border-color:var(--txt);transform:scale(1.15);}
.csc::after{content:'';position:absolute;inset:0;font-size:0.5rem;color:white;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.csc.on::after{content:'\2713';}
.edit-ban{background:var(--blue-l);border:1px solid var(--blue);border-radius:var(--rs);padding:6px 9px;font-size:0.72rem;color:var(--blue);font-weight:500;display:none;}
.form-btns{display:flex;gap:6px;}
.btn-sv{flex:1;background:var(--acc);color:white;border:none;padding:8px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all var(--t);}
.btn-sv:hover{background:#1d5235;}
.btn-cn{background:var(--surf2);color:var(--muted);border:1px solid var(--bdr);padding:8px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:0.8rem;cursor:pointer;display:none;touch-action:manipulation;}
.ev-list{display:flex;flex-direction:column;gap:5px;}
.ev-item{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--rs);padding:7px 9px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;border-left:3px solid var(--ec,var(--acc-m));}
.ev-inf{flex:1;min-width:0;}
.ev-t{font-size:0.78rem;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-tm{font-size:0.65rem;color:var(--muted);}
.ev-bdg{font-size:0.58rem;font-weight:600;padding:1px 5px;border-radius:7px;background:var(--ecl,var(--acc-l));color:var(--ec,var(--acc));white-space:nowrap;flex-shrink:0;align-self:center;}
.ev-acts{display:flex;gap:3px;flex-shrink:0;}
.ev-ed{background:var(--acc-l);border:none;cursor:pointer;color:var(--acc);font-size:0.62rem;font-weight:600;padding:2px 6px;border-radius:3px;font-family:'DM Sans',sans-serif;touch-action:manipulation;}
.ev-ed:hover{background:var(--acc);color:white;}
.ev-dl{background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.95rem;padding:2px 3px;touch-action:manipulation;}
.ev-dl:hover{color:var(--red);}
.empty-s{font-size:0.74rem;color:var(--muted);font-style:italic;text-align:center;padding:8px 0;}
.hdn{font-size:0.73rem;color:var(--hol);font-weight:500;background:var(--hol-l);border-radius:5px;padding:6px 9px;border-left:3px solid var(--hol);}

/* MOBILE SHEET */
.sh-ov{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;pointer-events:none;display:none;transition:opacity 0.25s;backdrop-filter:blur(2px);}
.sh-ov.on{opacity:1;pointer-events:all;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,0.2);}
.sheet.on{transform:translateY(0);}
.sh-hdl{width:34px;height:4px;background:var(--bdr);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sh-head{padding:11px 18px 9px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sh-title{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;color:var(--txt);}
.sh-close{background:var(--surf2);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:0.9rem;color:var(--muted);display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px 18px 32px;flex:1;display:flex;flex-direction:column;gap:10px;}
.sh-hd-badge{font-size:0.78rem;color:var(--hol);font-weight:500;border-radius:7px;padding:6px 10px;border-left:3px solid var(--hol);background:var(--hol-l);}
.sh-ev-list{display:flex;flex-direction:column;gap:6px;}
.sh-ev{background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:9px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:7px;border-left:3px solid var(--ec,var(--acc-m));}
.sh-ev-inf{flex:1;min-width:0;}
.sh-ev-t{font-size:0.86rem;font-weight:600;color:var(--txt);margin-bottom:2px;}
.sh-ev-tm{font-size:0.71rem;color:var(--muted);}
.sh-ev-bdg{font-size:0.6rem;font-weight:600;padding:2px 6px;border-radius:8px;background:var(--ecl,var(--acc-l));color:var(--ec,var(--acc));white-space:nowrap;flex-shrink:0;}
.sh-ev-acts{display:flex;gap:5px;align-items:center;}
.sh-edit{background:var(--acc-l);border:none;cursor:pointer;color:var(--acc);font-size:0.7rem;font-weight:600;padding:4px 8px;border-radius:5px;font-family:'DM Sans',sans-serif;touch-action:manipulation;}
.sh-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:2px 4px;touch-action:manipulation;}
.sh-no-ev{font-size:0.84rem;color:var(--muted);text-align:center;padding:16px 0 5px;line-height:1.6;}
.sh-no-ev em{display:block;font-size:1.5rem;margin-bottom:6px;font-style:normal;}
.sh-form-t{font-family:'Playfair Display',serif;font-size:0.9rem;font-weight:600;color:var(--txt);}
.sh-edit-ban{background:var(--blue-l);border:1px solid var(--blue);border-radius:7px;padding:6px 10px;font-size:0.74rem;color:var(--blue);font-weight:500;}
.sh-form{display:flex;flex-direction:column;gap:9px;position:relative;}
.sh-form input,.sh-form textarea,.sh-form select{width:100%;padding:11px 12px;border:1px solid var(--bdr);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--txt);background:var(--surf2);outline:none;-webkit-appearance:none;appearance:none;}
.sh-form input:focus,.sh-form textarea:focus,.sh-form select:focus{border-color:var(--acc);}
.sh-form textarea{resize:none;height:58px;}
.sh-r2{display:flex;gap:7px;}
.sh-r2>*{flex:1;}
.sh-clr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sh-clr-lbl{font-size:0.72rem;color:var(--muted);width:100%;}
.sh-cs{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all var(--t);touch-action:manipulation;position:relative;}
.sh-cs.on{border-color:var(--txt);transform:scale(1.15);}
.sh-cs::after{content:'';position:absolute;inset:0;font-size:0.6rem;color:white;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.sh-cs.on::after{content:'\2713';}
.sh-btns{display:flex;gap:7px;}
.sh-save{flex:1;background:var(--acc);color:white;border:none;padding:12px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;touch-action:manipulation;}
.sh-save:active{transform:scale(0.97);}
.sh-cancel{background:var(--surf2);color:var(--muted);border:1px solid var(--bdr);padding:12px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.88rem;cursor:pointer;touch-action:manipulation;}

/* MOBILE NAV */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--bdr);padding:5px 0 max(5px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -1px 10px rgba(0,0,0,0.07);}
.mob-tabs{display:flex;justify-content:space-around;}
.mob-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;border:none;background:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.58rem;font-weight:500;transition:color var(--t);touch-action:manipulation;}
.mob-tab.on{color:var(--acc);}
.mob-tab svg{width:20px;height:20px;}
.mob-dot{width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:0;}
.mob-tab.on .mob-dot{opacity:1;}

/* FAB */
.fab{display:none;position:fixed;bottom:72px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:white;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 16px rgba(45,106,79,0.4);z-index:99;align-items:center;justify-content:center;touch-action:manipulation;}
.fab:active{transform:scale(0.92);}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.modal-bg.hidden{display:none;}
.modal{background:var(--surf);border-radius:var(--r);padding:20px;max-width:290px;width:100%;box-shadow:var(--shd-lg);}
.modal-t{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;margin-bottom:5px;}
.modal-b{font-size:0.78rem;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.modal-btns{display:flex;flex-direction:column;gap:6px;}
.m-btn{padding:9px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:500;cursor:pointer;touch-action:manipulation;}
.m-one{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr);}
.m-all{background:var(--red);color:white;}
.m-cancel{background:none;color:var(--muted);}

/* LOADER */
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999;}
.loader.gone{display:none;}
.spin{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-t{font-family:'Playfair Display',serif;font-size:0.9rem;color:var(--muted);}

/* TOAST */
.toast-el{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:white;padding:8px 16px;border-radius:9px;font-size:0.78rem;font-family:'DM Sans',sans-serif;z-index:600;box-shadow:var(--shd-lg);white-space:nowrap;pointer-events:none;}

/* RESPONSIVE */
@media(max-width:768px){
  header{padding:10px 13px;gap:6px;}
  .logo{font-size:1.05rem;}
  header .sub,.leg{display:none;}
  .vtabs{display:none;}
  .wx{display:none;}
  .main{padding:9px 9px 75px;}
  .sb{display:none;}
  .mob-nav{display:block;}
  .sh-ov{display:block;}
  .fab{display:flex;}
  .ch-lbl{font-size:1.2rem;}
  /* MONTH — fill screen height */
  .dgrid{grid-auto-rows:72px;gap:2px;}
  .dc{border-radius:6px;padding:4px;}
  .dc .hml,.dc .ep,.dc .em{display:none;}
  .edots{display:flex;}
  .dn{font-size:0.74rem;width:22px;height:22px;}
  .dc.tod .dn{background:var(--blue);color:white;}
  /* YEAR */
  .ygrid{grid-template-columns:repeat(2,1fr);gap:8px;}
  /* WEEK — fill screen, cards are rows */
  .wgrid{grid-template-columns:1fr;grid-auto-rows:auto;gap:5px;}
  .wc{flex-direction:row;align-items:center;padding:11px 13px;gap:10px;height:auto;min-height:60px;overflow:visible;}
  .wc-day{font-size:0.62rem;width:24px;text-align:center;flex-shrink:0;}
  .wc-num{font-size:1.4rem;width:36px;text-align:center;flex-shrink:0;}
  .wc-evs{flex-direction:row;flex-wrap:wrap;margin-top:0;flex:1;gap:3px;align-items:center;overflow:visible;}
  .wc-ev{font-size:0.6rem;padding:2px 5px;}
  .wc-empty{font-size:0.62rem;}
  /* AGENDA */
  .ag-ev{max-width:100%;}
  /* PLANNER */
  .pl-wrap{max-width:100%;}
  .pl-time{min-width:70px;font-size:0.67rem;}
  .pl-blk{gap:7px;padding:9px 7px;}
}
@media(min-width:769px){
  .sh-ov,.sheet,.mob-nav,.fab{display:none!important;}
  .sb{display:flex;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="spin"></div><div class="loader-t">Loading your agenda...</div></div>

<div class="modal-bg hidden" id="delModal">
  <div class="modal">
    <div class="modal-t">Delete recurring event?</div>
    <div class="modal-b">Delete just this one, or all occurrences?</div>
    <div class="modal-btns">
      <button class="m-btn m-one" id="mOne">Delete this one only</button>
      <button class="m-btn m-all" id="mAll">Delete all occurrences</button>
      <button class="m-btn m-cancel" id="mCan">Cancel</button>
    </div>
  </div>
</div>

<header>
  <div class="logo">&#128197; My Agenda</div>
  <div class="wx" id="wxWrap" style="display:none;"><span id="wxIcon">&#127775;</span><span id="wxTemp">--°C</span></div>
  <div class="sync-row"><div class="sdot" id="sdot"></div><span class="stxt" id="stxt">Connecting...</span></div>
  <div class="vtabs">
    <button class="vt" id="vt-year" onclick="setView('year')">Year</button>
    <button class="vt on" id="vt-month" onclick="setView('month')">Month</button>
    <button class="vt" id="vt-week" onclick="setView('week')">Week</button>
    <button class="vt" id="vt-agenda" onclick="setView('agenda')">Countdowns</button>
    <button class="vt" id="vt-plan" onclick="setView('plan')">Planner</button>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" id="darkBtn" onclick="toggleDark()" title="Dark mode">&#9790;</button>
    <div class="leg">
      <div class="li"><div class="ld" style="background:#E03E3E"></div>Red</div>
      <div class="li"><div class="ld" style="background:#F5940A"></div>Orange</div>
      <div class="li"><div class="ld" style="background:#F5C800"></div>Yellow</div>
      <div class="li"><div class="ld" style="background:#2D8A55"></div>Green</div>
      <div class="li"><div class="ld" style="background:#2F72C4"></div>Blue</div>
      <div class="li"><div class="ld" style="background:#7B52C8"></div>Purple</div>
    </div>
  </div>
</header>

<div class="app">
  <div class="main" id="mainPanel"></div>
  <div class="sb">
    <div>
      <div class="sb-h" id="sbH">Add Event</div>
      <div class="edit-ban" id="editBan">&#9999; Editing event</div>
      <div class="sb-lbl" id="sbLbl">Select a day on the calendar</div>
      <div class="sb-form">
        <div class="r2">
          <input type="text" id="eTitle" placeholder="Event title *" style="flex:1;">
          <button class="eb-btn" onclick="toggleEP('deskEP','eTitle')">&#128515;</button>
        </div>
        <div class="ep-pop" id="deskEP"></div>
        <div class="r2"><input type="time" id="eStart"><input type="time" id="eEnd"></div>
        <textarea id="eNote" placeholder="Note (optional)"></textarea>
        <div class="r2">
          <select id="eRep">
            <option value="none">No repeat</option><option value="daily">Daily</option>
            <option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option>
          </select>
          <select id="eRem" onchange="tRT(this.value,'deskRT')">
            <option value="none">No reminder</option><option value="15min">15 min before</option>
            <option value="1hr">1 hr before</option><option value="1day">1 day before</option>
            <option value="1week">1 week before</option><option value="custom">Custom time...</option>
          </select>
        </div>
        <input type="time" id="deskRT" style="display:none;" placeholder="Reminder time">
        <div class="clr-row">
          <div class="clr-lbl">Colour</div>
          <div class="csc on" style="background:#E03E3E" data-c="red" onclick="pickC(this,'desk')"></div>
          <div class="csc" style="background:#F5940A" data-c="orange" onclick="pickC(this,'desk')"></div>
          <div class="csc" style="background:#F5C800" data-c="yellow" onclick="pickC(this,'desk')"></div>
          <div class="csc" style="background:#2D8A55" data-c="green" onclick="pickC(this,'desk')"></div>
          <div class="csc" style="background:#2F72C4" data-c="blue" onclick="pickC(this,'desk')"></div>
          <div class="csc" style="background:#7B52C8" data-c="purple" onclick="pickC(this,'desk')"></div>
        </div>
        <div class="form-btns">
          <button class="btn-cn" id="btnCN" onclick="cancelEdit()">Cancel</button>
          <button class="btn-sv" id="btnSV" onclick="submitDesk()">+ Add Event</button>
        </div>
      </div>
    </div>
    <div>
      <div class="sb-h">Events on this day</div>
      <div class="ev-list" id="evList"><div class="empty-s">No day selected</div></div>
    </div>
  </div>
</div>

<div class="sh-ov" id="shOv" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sh-hdl"></div>
  <div class="sh-head"><div class="sh-title" id="shTitle"></div><button class="sh-close" onclick="closeSheet()">&#x2715;</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<button class="fab" onclick="openAddSheet()">+</button>

<script>
// CONFIG
const DB='https://calendar-4b1de-default-rtdb.europe-west1.firebasedatabase.app/events';
const DB_PLAN='https://calendar-4b1de-default-rtdb.europe-west1.firebasedatabase.app/timeblocks';
const DB_TPL='https://calendar-4b1de-default-rtdb.europe-west1.firebasedatabase.app/blocktemplates';
const DB_CDS='https://calendar-4b1de-default-rtdb.europe-west1.firebasedatabase.app/countdowns';
const DB_REMS='https://calendar-4b1de-default-rtdb.europe-west1.firebasedatabase.app/reminders';
const DB_SUBS='https://calendar-4b1de-default-rtdb.europe-west1.firebasedatabase.app/subscriptions';
const VAPID='BP_l0vy2WLkFlu5nJ1sYTK4ueh9qTL8Kqzpe_vo3-gZWdI9-k2tiHVjwr6cIzxExKTyBLCiBG0_gbyQmx4Ci_d8';
const EMOJIS=['📅','📆','⏰','🔔','✅','❌','🎯','💼','🏥','🏋️','🎉','🎂','✈️','🏖️','📚','💊','🍽️','🛒','📞','💰','🎵','🏠','🚗','💪','🌟','⭐','🔥','💡','📝','🎈','🎁','🌿','☀️','🌙','🤝','🎓','💻','🔑','🗓️','🧘','🏃','🍀','💤','📊','🎨','🚀','🌈','🍕','☕','🎮'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WE=[5,6];
const C={
  red:{h:'#E03E3E',l:'#FDEAEA',n:'Red'},
  orange:{h:'#F5940A',l:'#FEF0D6',n:'Orange'},
  yellow:{h:'#F5C800',l:'#FFFACC',n:'Yellow'},
  green:{h:'#2D8A55',l:'#DFF2E8',n:'Green'},
  blue:{h:'#2F72C4',l:'#DDEEFF',n:'Blue'},
  purple:{h:'#7B52C8',l:'#EDE5FB',n:'Purple'}
};

// HOLIDAYS
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31)-1,da=((h+l-7*m+114)%31)+1;return new Date(y,mo,da);}
const HC={};
function getHols(y){if(HC[y])return HC[y];const e=easter(y),ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};const kg=new Date(y,3,27).getDay()===0?new Date(y,3,26):new Date(y,3,27);HC[y]={[dk(new Date(y,0,1))]:'Nieuwjaarsdag',[dk(ad(e,-2))]:'Goede Vrijdag',[dk(e)]:'Eerste Paasdag',[dk(ad(e,1))]:'Tweede Paasdag',[dk(kg)]:'Koningsdag',[dk(new Date(y,4,5))]:'Bevrijdingsdag',[dk(ad(e,39))]:'Hemelvaartsdag',[dk(ad(e,49))]:'Eerste Pinksterdag',[dk(ad(e,50))]:'Tweede Pinksterdag',[dk(new Date(y,11,25))]:'Eerste Kerstdag',[dk(new Date(y,11,26))]:'Tweede Kerstdag'};return HC[y];}
function dk(dt){return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());}
function fk(y,m,d){return y+'-'+p2(m+1)+'-'+p2(d);}
function p2(n){return String(n).padStart(2,'0');}
function getHol(y,m,d){return getHols(y)[fk(y,m,d)]||null;}

// DATE UTILS
const NOW=new Date(),TY=NOW.getFullYear(),TM=NOW.getMonth(),TD=NOW.getDate();
function isPast(y,m,d){return new Date(y,m,d)<new Date(TY,TM,TD);}
function isToday(y,m,d){return y===TY&&m===TM&&d===TD;}
function toMon(j){return(j+6)%7;}
function fmtDay(y,m,d){return WD[toMon(new Date(y,m,d).getDay())]+', '+MONTHS[m]+' '+d+', '+y;}
function isMob(){return window.innerWidth<=768;}
function sortEvs(a){return[...a].sort((x,y)=>(!x.start&&!y.start)?0:!x.start?1:!y.start?-1:x.start.localeCompare(y.start));}

// STATE
let CY=TY,CM=TM,CWS=null,SEL=null,SELC='red',VIEW='month';
let EK=null,EI=null,isSav=false,notifOk=false,pDel=null;
let EV={},PLAN={},TPL=[],CDS={};
let SHOW_CD_F=false;
let PLD={y:TY,m:TM,d:TD};
let PL_FORM=null,PL_COL='blue',PL_DUR=60,PL_DRAG=null;
let sseTimer=null;

// DARK MODE
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dk',document.body.classList.contains('dark')?'1':'0');document.getElementById('darkBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';}
if(localStorage.getItem('dk')==='1'){document.body.classList.add('dark');document.getElementById('darkBtn').textContent='☀️';}

// WEATHER
async function loadWeather(){
  try{
    let lat=51.77,lon=5.52;
    const cached=localStorage.getItem('wxPos');
    if(cached){const c=JSON.parse(cached);lat=c.lat;lon=c.lon;}
    else if(navigator.geolocation){
      try{
        const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:8000,maximumAge:0}));
        lat=p.coords.latitude;lon=p.coords.longitude;
        localStorage.setItem('wxPos',JSON.stringify({lat,lon}));
      }catch(e){}
    }
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto&forecast_days=1`);
    const d=await r.json();
    const ic={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌦️',82:'🌦️',95:'⛈️',96:'⛈️',99:'⛈️'};
    const code=d.current.weather_code;
    document.getElementById('wxIcon').textContent=ic[code]||ic[Math.floor(code/10)*10]||'🌡️';
    document.getElementById('wxTemp').textContent=Math.round(d.current.temperature_2m)+'°C';
    document.getElementById('wxWrap').style.display='flex';
  }catch(e){}
}

// SYNC STATUS
function setSync(s,t){const d=document.getElementById('sdot'),l=document.getElementById('stxt');d.className='sdot '+s;l.textContent=t;}

// FIREBASE
async function loadFB(){
  try{
    setSync('busy','Loading...');
    const [r1,r2,r3,r4]=await Promise.all([fetch(DB+'.json'),fetch(DB_PLAN+'.json'),fetch(DB_CDS+'.json'),fetch(DB_TPL+'.json')]);
    const [d1,d2,d3,d4]=await Promise.all([r1.json(),r2.json(),r3.json(),r4.json()]);
    EV=(d1&&typeof d1==='object')?d1:{};
    PLAN=(d2&&typeof d2==='object')?d2:{};
    CDS=(d3&&typeof d3==='object')?d3:{};
    TPL=Array.isArray(d4)?d4:[];
    setSync('ok','Synced');document.getElementById('loader').classList.add('gone');render();
  }catch(e){
    setSync('err','Offline');
    EV=JSON.parse(localStorage.getItem('ev4')||'{}');
    PLAN=JSON.parse(localStorage.getItem('plan1')||'{}');
    CDS=JSON.parse(localStorage.getItem('cds1')||'{}');
    TPL=JSON.parse(localStorage.getItem('tpl1')||'[]');
    document.getElementById('loader').classList.add('gone');render();
  }
}
async function saveFB(){
  isSav=true;
  try{setSync('busy','Saving...');await fetch(DB+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(EV)});setSync('ok','Synced');}
  catch(e){setSync('err','Save failed');}
  finally{setTimeout(()=>isSav=false,3000);}
}
async function savePlan(){localStorage.setItem('plan1',JSON.stringify(PLAN));try{await fetch(DB_PLAN+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(PLAN)});setSync('ok','Synced');}catch(e){setSync('err','Offline');}}
async function saveTpl(){localStorage.setItem('tpl1',JSON.stringify(TPL));try{await fetch(DB_TPL+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(TPL)});}catch(e){}}
async function saveCDS(){localStorage.setItem('cds1',JSON.stringify(CDS));try{await fetch(DB_CDS+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(CDS)});}catch(e){}}
function save(){localStorage.setItem('ev4',JSON.stringify(EV));saveFB();}
function startSSE(){
  const src=new EventSource(DB+'.json');
  src.addEventListener('put',e=>{
    try{const msg=JSON.parse(e.data);if(!msg||!msg.data||typeof msg.data!=='object')return;if(isSav)return;if(JSON.stringify(msg.data)===JSON.stringify(EV))return;EV=msg.data;localStorage.setItem('ev4',JSON.stringify(EV));setSync('ok','Synced');clearTimeout(sseTimer);sseTimer=setTimeout(()=>{render();if(SEL&&!isMob())renderSB();},300);}catch(ex){}
  });
  src.onerror=()=>setSync('err','Disconnected');
}

// PUSH NOTIFICATIONS
function b64u(s){const r=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0));}
async function initNotifs(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
  if(Notification.permission==='default')showNotifBanner();
  else if(Notification.permission==='granted'){notifOk=true;doSub();}
}
function showNotifBanner(){
  if(document.getElementById('notifBan'))return;
  const b=document.createElement('div');b.id='notifBan';
  b.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--acc);color:white;padding:10px 15px;border-radius:11px;font-size:0.78rem;font-family:DM Sans,sans-serif;z-index:500;display:flex;align-items:center;gap:8px;box-shadow:var(--shd-lg);max-width:92vw;';
  b.innerHTML='<span>&#128276; Enable reminders</span>';
  const btn=document.createElement('button');btn.textContent='Enable';btn.style.cssText='background:white;color:var(--acc);border:none;padding:4px 10px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.78rem;touch-action:manipulation;';
  btn.onclick=async()=>{const p=await Notification.requestPermission();notifOk=(p==='granted');b.remove();if(notifOk)doSub();};
  const x=document.createElement('button');x.textContent='✕';x.style.cssText='background:none;border:none;color:rgba(255,255,255,0.7);cursor:pointer;font-size:0.9rem;padding:0 2px;';
  x.onclick=()=>b.remove();b.appendChild(btn);b.appendChild(x);document.body.appendChild(b);setTimeout(()=>{if(b.parentNode)b.remove();},14000);
}
async function doSub(){
  try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});const k=btoa(sub.endpoint).replace(/[^a-zA-Z0-9]/g,'').slice(-20);await fetch(DB_SUBS+'/'+k+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});notifOk=true;}catch(e){console.log('Push sub failed:',e.message);}
}
function getFireAt(ev,key){
  if(!ev.reminder||ev.reminder==='none')return null;
  const[y,mo,d]=key.split('-').map(Number);
  if(ev.reminder==='custom'){if(!ev.reminderTime)return null;const[rh,rm]=ev.reminderTime.split(':').map(Number);return new Date(y,mo-1,d,rh,rm,0,0);}
  if(!ev.start)return null;
  const[eh,em]=ev.start.split(':').map(Number);const et=new Date(y,mo-1,d,eh,em,0,0);
  const off={'15min':15,'1hr':60,'1day':1440,'1week':10080};return new Date(et.getTime()-(off[ev.reminder]||0)*60000);
}
async function storeRem(ev,key){
  const ft=getFireAt(ev,key);if(!ft||ft<=Date.now())return;
  const id=key+'_'+ev.title.replace(/\W/g,'').slice(0,8)+'_'+ft.getTime();
  const[,mo,d]=key.split('-').map(Number);const ts=ev.start?' at '+ev.start:'';
  await fetch(DB_REMS+'/'+id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'📅 '+ev.title,body:MONTHS[mo-1]+' '+d+ts+(ev.note?' — '+ev.note:''),fireAt:ft.getTime()})}).catch(()=>{});
}
async function storeCdRem(cd,id){
  const target=new Date(cd.targetDate+'T09:00:00');
  const off={'1week':7*24*60,'48h':48*60,'24h':24*60,'1h':60};
  const mins=off[cd.reminder]||0;if(!mins)return;
  const ft=new Date(target.getTime()-mins*60000);if(ft<=Date.now())return;
  const labels={'1week':'in 1 week!','48h':'in 48 hours!','24h':'tomorrow!','1h':'in 1 hour!'};
  await fetch(DB_REMS+'/cd_'+id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'⏰ '+cd.name,body:cd.name+' is '+labels[cd.reminder],fireAt:ft.getTime()})}).catch(()=>{});
}

// TOAST
function toast(msg){const t=document.createElement('div');t.className='toast-el';t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);}
function tRT(v,id){const el=document.getElementById(id);if(el)el.style.display=v==='custom'?'block':'none';}

// EMOJI PICKER
function buildEP(el,inp){if(el.children.length)return;const g=document.createElement('div');g.className='ep-grid';EMOJIS.forEach(em=>{const b=document.createElement('div');b.className='ep-e';b.textContent=em;b.addEventListener('click',e=>{e.stopPropagation();inp.value+=em;inp.focus();el.classList.remove('open');});g.appendChild(b);});el.appendChild(g);}
function toggleEP(pid,iid){const p=document.getElementById(pid),i=document.getElementById(iid);buildEP(p,i);p.classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.eb-btn')&&!e.target.closest('.sh-em-btn')&&!e.target.closest('.ep-pop')&&!e.target.closest('.sh-ep'))document.querySelectorAll('.ep-pop,.sh-ep').forEach(p=>p.classList.remove('open'));});

// COLOR
function pickC(el,ctx){if(ctx==='desk')document.querySelectorAll('.csc').forEach(s=>s.classList.remove('on'));else document.querySelectorAll('.sh-cs').forEach(s=>s.classList.remove('on'));el.classList.add('on');SELC=el.dataset.c;}

// RECURRING
function genDates(key,rep,count){const[y,m,d]=key.split('-').map(Number),dates=[],dt=new Date(y,m-1,d);for(let i=0;i<count;i++){dates.push(dk(new Date(dt)));if(rep==='daily')dt.setDate(dt.getDate()+1);else if(rep==='weekly')dt.setDate(dt.getDate()+7);else if(rep==='monthly')dt.setMonth(dt.getMonth()+1);else if(rep==='yearly')dt.setFullYear(dt.getFullYear()+1);else break;}return dates;}
function saveEv(key,obj){const rep=obj.repeat||'none';if(rep==='none'){if(!EV[key])EV[key]=[];EV[key].push({...obj});return 1;}const rid='rec_'+Date.now(),counts={daily:60,weekly:26,monthly:12,yearly:5};const dates=genDates(key,rep,counts[rep]||1);dates.forEach(dk2=>{if(!EV[dk2])EV[dk2]=[];const inst={...obj,recurId:rid,repeat:'none'};EV[dk2].push(inst);storeRem(inst,dk2);});toast('&#8635; '+dates.length+' '+rep+' events created!');return dates.length;}
function applyEdit(key,idx,obj){
  const old=EV[key][idx]||{};
  if((obj.repeat||'none')!=='none'){
    if(old.recurId)Object.keys(EV).forEach(k=>{EV[k]=(EV[k]||[]).filter(e=>e.recurId!==old.recurId);if(!EV[k].length)delete EV[k];});
    else{EV[key].splice(idx,1);if(!EV[key].length)delete EV[key];}
    saveEv(key,obj);
  }else{
    EV[key][idx]={...old,...obj};
    storeRem(EV[key][idx],key);
  }
}
function delEv(key,idx){const ev=EV[key][idx];if(ev.recurId){pDel={key,idx,rid:ev.recurId};document.getElementById('delModal').classList.remove('hidden');}else doDel1(key,idx);}
function doDel1(key,idx){EV[key].splice(idx,1);if(!EV[key].length)delete EV[key];save();render();if(SEL&&!isMob())renderSB();}
function doDelAll(rid){Object.keys(EV).forEach(k=>{EV[k]=(EV[k]||[]).filter(e=>e.recurId!==rid);if(!EV[k].length)delete EV[k];});save();render();if(SEL&&!isMob())renderSB();}
document.getElementById('mOne').onclick=()=>{if(pDel)doDel1(pDel.key,pDel.idx);document.getElementById('delModal').classList.add('hidden');if(SEL&&isMob())openSheet(SEL.y,SEL.m,SEL.d);pDel=null;};
document.getElementById('mAll').onclick=()=>{if(pDel)doDelAll(pDel.rid);document.getElementById('delModal').classList.add('hidden');if(SEL&&isMob())openSheet(SEL.y,SEL.m,SEL.d);pDel=null;};
document.getElementById('mCan').onclick=()=>{document.getElementById('delModal').classList.add('hidden');pDel=null;};

// VIEW
function setView(v){VIEW=v;['year','month','week','agenda','plan'].forEach(t=>{const d=document.getElementById('vt-'+t);if(d)d.classList.toggle('on',t===v);const mn=document.getElementById('mn-'+t);if(mn)mn.classList.toggle('on',t===v);});const fb=document.querySelector('.fab');if(fb)fb.style.display=(v==='plan'||v==='agenda')?'none':'';animRender();}
async function animRender(){const p=document.getElementById('mainPanel');p.style.opacity='0';p.style.transform='translateY(5px)';await new Promise(r=>setTimeout(r,100));render();p.style.transition='opacity 0.18s ease,transform 0.18s ease';p.style.opacity='1';p.style.transform='translateY(0)';setTimeout(()=>{p.style.transition='';},200);}
function render(){if(VIEW==='year')rYear();else if(VIEW==='month')rMonth();else if(VIEW==='week')rWeek();else if(VIEW==='plan')rPlan();else rAgenda();}

// NAV BUILDER
function mkNav(label,yr,pFn,nFn){const h=document.createElement('div');h.className='ch';const L=document.createElement('div');const pl=document.createElement('span');pl.className='ch-lbl';pl.textContent=label;L.appendChild(pl);if(yr!=null){const yl=document.createElement('span');yl.className='ch-yr';yl.textContent=yr;L.appendChild(yl);}h.appendChild(L);const row=document.createElement('div');row.className='ch-nav';const tb=document.createElement('button');tb.className='tb';tb.textContent='Today';tb.onclick=goToday;row.appendChild(tb);const pb=document.createElement('button');pb.className='nb';pb.innerHTML='&#8249;';pb.onclick=pFn;row.appendChild(pb);const nb=document.createElement('button');nb.className='nb';nb.innerHTML='&#8250;';nb.onclick=nFn;row.appendChild(nb);h.appendChild(row);return h;}

// YEAR

function mkDC(y,m,d,oth,ci,iSel){const past=!oth&&isPast(y,m,d),tod=!oth&&isToday(y,m,d),wknd=WE.includes(ci),hol=!oth?getHol(y,m,d):null,evs=!oth?sortEvs(EV[fk(y,m,d)]||[]):[];const dc=document.createElement('div');dc.className=['dc',oth?'oth':'',past?'past':'',tod?'tod':'',iSel?'sel':'',wknd?'we':'',hol?'hd':''].filter(Boolean).join(' ');dc.dataset.y=y;dc.dataset.m=m;dc.dataset.d=d;const dn=document.createElement('div');dn.className='dn';dn.textContent=d;dc.appendChild(dn);if(hol){const hm=document.createElement('div');hm.className='hml';hm.textContent=hol;dc.appendChild(hm);}const mx=hol?1:2;evs.slice(0,mx).forEach(ev=>{const cm=C[ev.color]||C.green;const pill=document.createElement('div');pill.className='ep';pill.style.setProperty('--ec',cm.h);pill.style.setProperty('--ecl',cm.l);pill.textContent=ev.title;dc.appendChild(pill);});if(evs.length>mx){const mo=document.createElement('div');mo.className='em';mo.textContent='+'+(evs.length-mx)+' more';dc.appendChild(mo);}if(!oth&&(evs.length||hol)){const dots=document.createElement('div');dots.className='edots';if(hol){const dot=document.createElement('div');dot.className='edot';dot.style.background=C.orange.h;dots.appendChild(dot);}evs.slice(0,3).forEach(ev=>{const cm=C[ev.color]||C.green;const dot=document.createElement('div');dot.className='edot';dot.style.background=cm.h;dots.appendChild(dot);});dc.appendChild(dots);}return dc;}

mo=document.createElement('div');mo.className='wc-more';mo.textContent='+'+(evs.length-5)+' more';ew.appendChild(mo);}}wc.appendChild(ew);cards.appendChild(wc);}p.appendChild(cards);if(SEL&&!isMob()){const sd=new Date(SEL.y,SEL.m,SEL.d),ws2=new Date(CWS),we2=new Date(CWS);we2.setDate(we2.getDate()+6);if(sd>=ws2&&sd<=we2)renderDD(p);}}
function renderDD(container){const{y,m,d}=SEL,evs=sortEvs(EV[fk(y,m,d)]||[]),hol=getHol(y,m,d);const panel=document.createElement('div');panel.className='dd';const tEl=document.createElement('div');tEl.className='dd-t';tEl.textContent=fmtDay(y,m,d);if(hol){const hb=document.createElement('span');hb.className='dd-hbadge';hb.textContent='🇳🇱 '+hol;tEl.appendChild(hb);}panel.appendChild(tEl);if(!evs.length){const nm=document.createElement('div');nm.className='no-ev';nm.textContent='No events on this day.';panel.appendChild(nm);container.appendChild(panel);return;}const bH={};evs.forEach(ev=>{const h=ev.start?parseInt(ev.start):null;const k=(h!==null)?String(h):'all';if(!bH[k])bH[k]=[];bH[k].push(ev);});const tl=document.createElement('div');tl.className='tl';if(bH.all){const row=document.createElement('div');row.className='tl-r';const tt=document.createElement('div');tt.className='tl-t';tt.textContent='All day';const ln=document.createElement('div');ln.className='tl-ln';const co=document.createElement('div');co.className='tl-b';bH.all.forEach(ev=>{const cm=C[ev.color]||C.green;const el=document.createElement('div');el.className='tl-ev';el.style.setProperty('--ec',cm.h);el.style.setProperty('--ecl',cm.l);const t=document.createElement('div');t.className='tl-ev-t';t.textContent=ev.title;el.appendChild(t);if(ev.note){const n=document.createElement('div');n.className='tl-ev-n';n.textContent=ev.note;el.appendChild(n);}co.appendChild(el);});row.appendChild(tt);row.appendChild(ln);row.appendChild(co);tl.appendChild(row);}const hrs=Object.keys(bH).filter(k=>k!=='all').map(Number).sort((a,b)=>a-b);hrs.forEach(h=>{const row=document.createElement('div');row.className='tl-r';const tt=document.createElement('div');tt.className='tl-t';tt.textContent=p2(h)+':00';const ln=document.createElement('div');ln.className='tl-ln';const co=document.createElement('div');co.className='tl-b';bH[String(h)].forEach(ev=>{const cm=C[ev.color]||C.green;const el=document.createElement('div');el.className='tl-ev';el.style.setProperty('--ec',cm.h);el.style.setProperty('--ecl',cm.l);const t=document.createElement('div');t.className='tl-ev-t';t.textContent=(ev.end?ev.start+'-'+ev.end+'  ':ev.start+'  ')+ev.title;el.appendChild(t);if(ev.note){const n=document.createElement('div');n.className='tl-ev-n';n.textContent=ev.note;el.appendChild(n);}co.appendChild(el);});row.appendChild(tt);row.appendChild(ln);row.appendChild(co);tl.appendChild(row);});panel.appendChild(tl);container.appendChild(panel);}

// AGENDA
function rAgenda(){
  const p=document.getElementById('mainPanel');p.innerHTML='';
  const h=document.createElement('div');h.className='ch';const pl=document.createElement('span');pl.className='ch-lbl';pl.textContent='Countdowns';h.appendChild(pl);p.appendChild(h);
  // COUNTDOWNS
