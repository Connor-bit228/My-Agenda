  const cdH=document.createElement('div');cdH.className='cd-hdr';cdH.style.justifyContent='flex-end';
  const cdBtn=document.createElement('button');cdBtn.className='cd-add';cdBtn.textContent='+ Add';cdBtn.onclick=()=>{SHOW_CD_F=!SHOW_CD_F;rAgenda();};cdH.appendChild(cdBtn);cdSec.appendChild(cdH);
  if(SHOW_CD_F){
    const form=document.createElement('div');form.className='cd-form';
    const ni=document.createElement('input');ni.type='text';ni.placeholder='Name (e.g. ✈️ Holiday)';
    const row=document.createElement('div');row.className='cd-row';
    const di=document.createElement('input');di.type='date';di.min=fk(TY,TM,TD);
    const rs=document.createElement('select');[{v:'none',t:'No reminder'},{v:'1week',t:'1 week before'},{v:'48h',t:'48 hrs before'},{v:'24h',t:'24 hrs before'},{v:'1h',t:'1 hour before'}].forEach(({v,t})=>{const o=document.createElement('option');o.value=v;o.textContent=t;rs.appendChild(o);});
    row.appendChild(di);row.appendChild(rs);
    const btns=document.createElement('div');btns.className='cd-btns';
    const sv=document.createElement('button');sv.className='cd-save';sv.textContent='Save';
    sv.onclick=()=>{const name=ni.value.trim();if(!name||!di.value){alert('Fill in all fields.');return;}const id='cd_'+Date.now();CDS[id]={name,targetDate:di.value,reminder:rs.value,createdAt:fk(TY,TM,TD)};if(rs.value!=='none')storeCdRem(CDS[id],id);saveCDS();SHOW_CD_F=false;rAgenda();toast('&#9200; Countdown added!');};
    const cn=document.createElement('button');cn.className='cd-cancel';cn.textContent='Cancel';cn.onclick=()=>{SHOW_CD_F=false;rAgenda();};
    btns.appendChild(cn);btns.appendChild(sv);form.appendChild(ni);form.appendChild(row);form.appendChild(btns);cdSec.appendChild(form);
  }
  const cdAll=Object.entries(CDS||{}).sort((a,b)=>a[1].targetDate.localeCompare(b[1].targetDate));
  const cdDiff=cd=>Math.ceil((new Date(cd.targetDate+'T00:00:00')-new Date(TY,TM,TD))/864e5);
  const cdItems=cdAll.filter(([,cd])=>cdDiff(cd)>=-1);
  const cdPast=cdAll.filter(([,cd])=>cdDiff(cd)<-1);
  if(cdItems.length){
    const cdList=document.createElement('div');cdList.className='cd-list';
    cdItems.forEach(([id,cd])=>{
      const target=new Date(cd.targetDate+'T00:00:00'),today=new Date(TY,TM,TD);
      const diff=Math.ceil((target-today)/864e5);
      const card=document.createElement('div');card.className='cd-card';
      const em=document.createElement('div');em.className='cd-emoji';em.textContent='🎯';
      const inf=document.createElement('div');inf.className='cd-info';
      const nm=document.createElement('div');nm.className='cd-name';nm.textContent=cd.name;
      const dy=document.createElement('div');dy.className='cd-days';
      if(diff<=0){dy.textContent='Today! 🎉';dy.style.color='var(--red)';}else dy.innerHTML=diff+'<span>'+(diff===1?'day left':'days left')+'</span>';
      const created=cd.createdAt?new Date(cd.createdAt+'T00:00:00'):new Date(target.getTime()-30*864e5);
      const total=Math.max(1,(target-created)/864e5),elapsed=Math.max(0,(today-created)/864e5);
      const bw=document.createElement('div');bw.className='cd-bar-w';const bar=document.createElement('div');bar.className='cd-bar';bar.style.width=Math.min(100,Math.round(elapsed/total*100))+'%';bw.appendChild(bar);
      inf.appendChild(nm);inf.appendChild(dy);inf.appendChild(bw);
      const del=document.createElement('button');del.className='cd-del';del.innerHTML='&times;';del.onclick=()=>{delete CDS[id];saveCDS();rAgenda();};
      card.appendChild(em);card.appendChild(inf);card.appendChild(del);cdList.appendChild(card);
    });
    cdSec.appendChild(cdList);
  } else if(!SHOW_CD_F){const em=document.createElement('div');em.className='cd-empty';em.textContent='Nothing on the horizon yet — tap + Add to start a countdown.';cdSec.appendChild(em);}
  if(cdPast.length){
    const ph=document.createElement('div');ph.className='cd-past-h';ph.textContent='Passed';cdSec.appendChild(ph);
    const pl2=document.createElement('div');pl2.className='cd-list cd-past';
    cdPast.forEach(([id,cd])=>{
      const ago=Math.abs(cdDiff(cd));
      const card=document.createElement('div');card.className='cd-card';
      const em2=document.createElement('div');em2.className='cd-emoji';em2.textContent='🏁';
      const inf=document.createElement('div');inf.className='cd-info';
      const nm=document.createElement('div');nm.className='cd-name';nm.textContent=cd.name;
      const dy=document.createElement('div');dy.className='cd-past-d';dy.textContent=ago+(ago===1?' day ago':' days ago');
      inf.appendChild(nm);inf.appendChild(dy);
      const del=document.createElement('button');del.className='cd-del';del.innerHTML='&times;';del.title='Delete';
      del.onclick=()=>{delete CDS[id];saveCDS();rAgenda();};
      card.appendChild(em2);card.appendChild(inf);card.appendChild(del);pl2.appendChild(card);
    });
    cdSec.appendChild(pl2);
  }
  p.appendChild(cdSec);
}

// PLANNER (timeboxing)
function t2m(t){if(!t)return 0;const a=t.split(':');return (+a[0])*60+(+(a[1]||0));}
function m2t(m){m=((Math.round(m)%1440)+1440)%1440;return p2(Math.floor(m/60))+':'+p2(m%60);}
function fmtDur(m){const hh=Math.floor(m/60),mm=m%60;if(!m)return '0m';return (hh?hh+'h':'')+(mm?(hh?' ':'')+mm+'m':'');}
function plKey(o){o=o||PLD;return fk(o.y,o.m,o.d);}
function plBlocks(o){const a=PLAN[plKey(o)];return Array.isArray(a)?a:[];}
function plSet(arr){const k=plKey();if(arr.length)PLAN[k]=arr;else delete PLAN[k];savePlan();}
function plShift(arr){for(let i=1;i<arr.length;i++){const prevEnd=t2m(arr[i-1].start)+(arr[i-1].dur||0);if(t2m(arr[i].start)<prevEnd)arr[i].start=m2t(prevEnd);}}
function plMove(i,j){const arr=plBlocks().slice();if(j<0||j>=arr.length)return;const[b]=arr.splice(i,1);arr.splice(j,0,b);plShift(arr);plSet(arr);rPlan();}
function plPrevDay(){const dt=new Date(PLD.y,PLD.m,PLD.d-1);return{y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate()};}

function rPlan(){
  const p=document.getElementById('mainPanel');p.innerHTML='';
  const dt=new Date(PLD.y,PLD.m,PLD.d),isT=isToday(PLD.y,PLD.m,PLD.d);
  p.appendChild(mkNav((isT?'Today':WD[toMon(dt.getDay())])+', '+PLD.d+' '+MS[PLD.m],isT?null:PLD.y,
    ()=>{const x=new Date(PLD.y,PLD.m,PLD.d-1);PLD={y:x.getFullYear(),m:x.getMonth(),d:x.getDate()};PL_FORM=null;rPlan();},
    ()=>{const x=new Date(PLD.y,PLD.m,PLD.d+1);PLD={y:x.getFullYear(),m:x.getMonth(),d:x.getDate()};PL_FORM=null;rPlan();}));

  const wrap=document.createElement('div');wrap.className='pl-wrap';
  const arr=plBlocks();

  // summary
  const planned=arr.reduce((s,b)=>s+(b.dur||0),0),doneN=arr.filter(b=>b.done).length;
  const sum=document.createElement('div');sum.className='pl-sum';
  const hol=getHol(PLD.y,PLD.m,PLD.d);
  sum.innerHTML='<span><b>'+arr.length+'</b> '+(arr.length===1?'block':'blocks')+'</span><span><b>'+fmtDur(planned)+'</b> planned</span>'+(arr.length?'<span><b>'+doneN+'</b> done</span>':'');
  if(hol){const hb=document.createElement('span');hb.className='ag-hbadge';hb.textContent='🇳🇱 '+hol;sum.appendChild(hb);}
  wrap.appendChild(sum);

  // carry over
  const prev=plPrevDay(),pending=plBlocks(prev).filter(b=>!b.done);
  if(pending.length){
    const cb=document.createElement('button');cb.className='pl-carry';
    cb.textContent='↷ Carry over '+pending.length+' unfinished '+(pending.length===1?'block':'blocks')+' from '+WD[toMon(new Date(prev.y,prev.m,prev.d).getDay())];
    cb.onclick=()=>{
      const pk=fk(prev.y,prev.m,prev.d);
      const keep=plBlocks(prev).filter(b=>b.done);
      const moved=pending.map(b=>({...b,id:'blk_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}));
      if(keep.length)PLAN[pk]=keep;else delete PLAN[pk];
      const next=plBlocks().concat(moved).sort((a,b)=>t2m(a.start)-t2m(b.start));
      PLAN[plKey()]=next;savePlan();rPlan();toast('↷ Carried over '+moved.length);
    };
    wrap.appendChild(cb);
  }

  // templates
  if(TPL.length||arr.length){
    const tw=document.createElement('div');tw.className='pl-tpls';
    const tl=document.createElement('div');tl.className='pl-tpls-lbl';tl.textContent=TPL.length?'Quick add':'';tw.appendChild(tl);
    TPL.forEach((t,i)=>{
      const cm=C[t.color]||C.blue;
      const chip=document.createElement('div');chip.className='pl-tpl';
      const dot=document.createElement('span');dot.className='pl-tpl-dot';dot.style.background=cm.h;
      const lb=document.createElement('span');lb.textContent=t.title+' · '+fmtDur(t.dur);
      chip.appendChild(dot);chip.appendChild(lb);
      chip.onclick=()=>{
        const cur=plBlocks().slice();
        const last=cur[cur.length-1];
        const st=last?m2t(t2m(last.start)+(last.dur||0)):'09:00';
        cur.push({id:'blk_'+Date.now(),title:t.title,start:st,dur:t.dur,color:t.color,done:false});
        plSet(cur);rPlan();toast('＋ '+t.title);
      };
      const x=document.createElement('button');x.className='pl-tpl-x';x.innerHTML='&times;';x.title='Remove template';
      x.onclick=e=>{e.stopPropagation();TPL.splice(i,1);saveTpl();rPlan();};
      chip.appendChild(x);tw.appendChild(chip);
    });
    if(TPL.length)wrap.appendChild(tw);
  }

  // blocks
  if(!arr.length&&!PL_FORM){
    const em=document.createElement('div');em.className='pl-empty';
    em.innerHTML='<em>🕘</em>Nothing boxed in yet.<br>Add your first block and give it a time.';
    wrap.appendChild(em);
  }
  if(arr.length){
    const list=document.createElement('div');list.className='pl-list';
    const nowMin=new Date().getHours()*60+new Date().getMinutes();
    arr.forEach((b,i)=>{
      const st=t2m(b.start),en=st+(b.dur||0);
      if(i>0){
        const prevEnd=t2m(arr[i-1].start)+(arr[i-1].dur||0),gap=st-prevEnd;
        const g=document.createElement('div');
        if(gap>0){g.className='pl-gap';g.textContent=fmtDur(gap)+' free';}
        else g.className='pl-sep';
        list.appendChild(g);
      }
      const cm=C[b.color]||C.blue;
      const el=document.createElement('div');
      el.className='pl-blk'+(b.done?' done':'')+((isT&&nowMin>=st&&nowMin<en&&!b.done)?' now':'');
      el.style.setProperty('--ec',cm.h);el.draggable=true;

      const chk=document.createElement('button');chk.className='pl-chk'+(b.done?' on':'');chk.innerHTML=b.done?'&#10003;':'';
      chk.setAttribute('aria-label',b.done?'Mark not done':'Mark done');
      chk.onclick=()=>{const a2=plBlocks().slice();a2[i]={...a2[i],done:!a2[i].done};plSet(a2);rPlan();};

      const tm=document.createElement('div');tm.className='pl-time';tm.textContent=b.start+' – '+m2t(en);
      const inf=document.createElement('div');inf.className='pl-info';
      const ti=document.createElement('div');ti.className='pl-title';ti.textContent=b.title;
      const du=document.createElement('div');du.className='pl-dur';du.textContent=fmtDur(b.dur||0);
      inf.appendChild(ti);inf.appendChild(du);
      inf.onclick=()=>{PL_FORM={idx:i};PL_COL=b.color||'blue';PL_DUR=b.dur||60;rPlan();};

      const acts=document.createElement('div');acts.className='pl-acts';
      const up=document.createElement('button');up.className='pl-act';up.innerHTML='&#9650;';up.title='Move up';up.disabled=i===0;up.onclick=()=>plMove(i,i-1);
      const dn=document.createElement('button');dn.className='pl-act';dn.innerHTML='&#9660;';dn.title='Move down';dn.disabled=i===arr.length-1;dn.onclick=()=>plMove(i,i+1);
      const dl=document.createElement('button');dl.className='pl-act del';dl.innerHTML='&times;';dl.title='Delete';
      dl.onclick=()=>{const a2=plBlocks().slice();a2.splice(i,1);plSet(a2);PL_FORM=null;rPlan();};
      acts.appendChild(up);acts.appendChild(dn);acts.appendChild(dl);

      el.appendChild(chk);el.appendChild(tm);el.appendChild(inf);el.appendChild(acts);

      el.addEventListener('dragstart',e=>{PL_DRAG=i;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      el.addEventListener('dragend',()=>{PL_DRAG=null;el.classList.remove('dragging');});
      el.addEventListener('dragover',e=>{e.preventDefault();if(PL_DRAG!==null&&PL_DRAG!==i)el.classList.add('over');});
      el.addEventListener('dragleave',()=>el.classList.remove('over'));
      el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');if(PL_DRAG!==null&&PL_DRAG!==i)plMove(PL_DRAG,i);});
      list.appendChild(el);
    });
    wrap.appendChild(list);
  }

  // form
  if(PL_FORM){
    const editing=PL_FORM.idx!=null,b=editing?arr[PL_FORM.idx]:null;
    const form=document.createElement('div');form.className='pl-form';
    const ft=document.createElement('div');ft.className='pl-lbl';ft.textContent=editing?'EDIT BLOCK':'NEW BLOCK';form.appendChild(ft);
    const ti=document.createElement('input');ti.type='text';ti.placeholder='What are you doing? (e.g. Deep work)';ti.value=b?b.title:'';form.appendChild(ti);

    const r2=document.createElement('div');r2.className='pl-r2';
    const stw=document.createElement('div');
    const sl=document.createElement('div');sl.className='pl-lbl';sl.textContent='Starts at';
    const si=document.createElement('input');si.type='time';
    const lastB=arr[arr.length-1];
    si.value=b?b.start:(lastB?m2t(t2m(lastB.start)+(lastB.dur||0)):'09:00');
    stw.appendChild(sl);stw.appendChild(si);r2.appendChild(stw);
    const dw=document.createElement('div');
    const dl2=document.createElement('div');dl2.className='pl-lbl';dl2.textContent='Minutes';
    const di=document.createElement('input');di.type='number';di.min='5';di.step='5';di.value=String(PL_DUR);
    di.oninput=()=>{PL_DUR=Math.max(5,+di.value||5);document.querySelectorAll('.pl-durb').forEach(x=>x.classList.toggle('on',+x.dataset.v===PL_DUR));};
    dw.appendChild(dl2);dw.appendChild(di);r2.appendChild(dw);
    form.appendChild(r2);

    const durs=document.createElement('div');durs.className='pl-durs';
    [15,30,45,60,90,120].forEach(v=>{const bt=document.createElement('button');bt.className='pl-durb'+(v===PL_DUR?' on':'');bt.dataset.v=v;bt.textContent=fmtDur(v);
      bt.onclick=()=>{PL_DUR=v;di.value=v;document.querySelectorAll('.pl-durb').forEach(x=>x.classList.toggle('on',+x.dataset.v===v));};durs.appendChild(bt);});
    form.appendChild(durs);

    const cl=document.createElement('div');cl.className='pl-lbl';cl.textContent='Colour';form.appendChild(cl);
    const cr=document.createElement('div');cr.className='pl-clr';
    Object.entries(C).forEach(([k,v])=>{const sw=document.createElement('div');sw.className='pl-cs'+(k===PL_COL?' on':'');sw.style.background=v.h;sw.dataset.c=k;sw.title=v.n;
      sw.onclick=()=>{PL_COL=k;document.querySelectorAll('.pl-cs').forEach(x=>x.classList.toggle('on',x.dataset.c===k));};cr.appendChild(sw);});
    form.appendChild(cr);

    const tpw=document.createElement('label');tpw.className='pl-tplchk';
    const tpc=document.createElement('input');tpc.type='checkbox';
    tpw.appendChild(tpc);tpw.appendChild(document.createTextNode('Also save as a reusable block'));
    form.appendChild(tpw);

    const btns=document.createElement('div');btns.className='pl-btns';
    const cn=document.createElement('button');cn.className='pl-cancel';cn.textContent='Cancel';cn.onclick=()=>{PL_FORM=null;rPlan();};
    const sv=document.createElement('button');sv.className='pl-save';sv.textContent=editing?'Save block':'Add block';
    sv.onclick=()=>{
      const title=ti.value.trim();
      if(!title){alert('Give the block a name.');ti.focus();return;}
      if(!si.value){alert('Pick a start time.');si.focus();return;}
      const dur=Math.max(5,+di.value||PL_DUR);
      const a2=plBlocks().slice();
      if(editing)a2[PL_FORM.idx]={...a2[PL_FORM.idx],title,start:si.value,dur,color:PL_COL};
      else a2.push({id:'blk_'+Date.now(),title,start:si.value,dur,color:PL_COL,done:false});
      a2.sort((x,y)=>t2m(x.start)-t2m(y.start));
      plSet(a2);
      if(tpc.checked&&!TPL.some(t=>t.title===title&&t.dur===dur)){TPL.push({title,dur,color:PL_COL});saveTpl();}
      PL_FORM=null;PL_DUR=60;rPlan();toast(editing?'&#10003; Saved':'&#10003; Block added');
    };
    btns.appendChild(cn);btns.appendChild(sv);form.appendChild(btns);
    wrap.appendChild(form);
    setTimeout(()=>{if(!editing)ti.focus();},50);
  } else {
    const nb=document.createElement('button');nb.className='pl-newbtn';nb.textContent='+ Add a block';
    nb.onclick=()=>{PL_FORM={};PL_DUR=60;rPlan();};
    wrap.appendChild(nb);
  }
  p.appendChild(wrap);
}

// SELECT DAY
function selDay(y,m,d){SEL={y,m,d};if(isMob()){render();openSheet(y,m,d);}else{cancelEdit();document.getElementById('sbLbl').textContent=fmtDay(y,m,d);render();renderSB();}}

// MOBILE SHEET
function openSheet(y,m,d){const key=fk(y,m,d),evs=sortEvs(EV[key]||[]),hol=getHol(y,m,d);document.getElementById('shTitle').textContent=fmtDay(y,m,d);const body=document.getElementById('shBody');body.innerHTML='';if(hol){const hn=document.createElement('div');hn.className='sh-hd-badge';hn.textContent='🇳🇱 '+hol;body.appendChild(hn);}if(evs.length){const list=document.createElement('div');list.className='sh-ev-list';evs.forEach(ev=>{const origIdx=EV[key].indexOf(ev);const cm=C[ev.color]||C.green;const item=document.createElement('div');item.className='sh-ev';item.style.setProperty('--ec',cm.h);item.style.setProperty('--ecl',cm.l);const inf=document.createElement('div');inf.className='sh-ev-inf';const tt=document.createElement('div');tt.className='sh-ev-t';tt.textContent=ev.title;const tm=document.createElement('div');tm.className='sh-ev-tm';let ts=ev.start?(ev.end?ev.start+' - '+ev.end:ev.start):'All day';if(ev.note)ts+='  ·  '+ev.note;tm.textContent=ts;inf.appendChild(tt);inf.appendChild(tm);const bdg=document.createElement('div');bdg.className='sh-ev-bdg';bdg.style.setProperty('--ec',cm.h);bdg.style.setProperty('--ecl',cm.l);bdg.textContent=cm.n;const acts=document.createElement('div');acts.className='sh-ev-acts';const eb=document.createElement('button');eb.className='sh-edit';eb.textContent='Edit';eb.addEventListener('click',e=>{e.stopPropagation();closeSheet();openAddSheet(y,m,d,origIdx);});const db=document.createElement('button');db.className='sh-del';db.innerHTML='&times;';db.addEventListener('click',e=>{e.stopPropagation();if(ev.recurId){pDel={key,idx:origIdx,rid:ev.recurId};document.getElementById('delModal').classList.remove('hidden');}else{EV[key].splice(origIdx,1);if(!EV[key].length)delete EV[key];save();render();openSheet(y,m,d);}});acts.appendChild(eb);acts.appendChild(db);item.appendChild(inf);item.appendChild(bdg);item.appendChild(acts);list.appendChild(item);});body.appendChild(list);}else{const em=document.createElement('div');em.className='sh-no-ev';em.innerHTML='<em>📭</em>No events.<br>Tap <strong>+</strong> to add one.';body.appendChild(em);}const addEvBtn=document.createElement('button');addEvBtn.className='sh-add-ev';addEvBtn.textContent='+ Add Event';addEvBtn.onclick=(()=>{const _y=y,_m=m,_d=d;return()=>openAddSheet(_y,_m,_d);})();body.appendChild(addEvBtn);document.getElementById('shOv').classList.add('on');document.getElementById('sheet').classList.add('on');document.body.style.overflow='hidden';}
function openAddSheet(y,m,d,editIdx){if(y===undefined){if(SEL){y=SEL.y;m=SEL.m;d=SEL.d;}else{y=TY;m=TM;d=TD;}}const key=fk(y,m,d),isEdit=editIdx!==undefined,ev2=isEdit?(EV[key]?.[editIdx]||{}):{};document.getElementById('shTitle').textContent=isEdit?'Edit Event':'New — '+fmtDay(y,m,d);const body=document.getElementById('shBody');body.innerHTML='';const ft=document.createElement('div');ft.className='sh-form-t';ft.textContent=isEdit?'Edit Event':'Add Event';body.appendChild(ft);if(isEdit){const ban=document.createElement('div');ban.className='sh-edit-ban';ban.textContent='Make your changes below';body.appendChild(ban);}const form=document.createElement('div');form.className='sh-form';const tr=document.createElement('div');tr.className='sh-r2';const inp=document.createElement('input');inp.type='text';inp.placeholder='Event title *';inp.value=isEdit?(ev2.title||''):'';inp.style.flex='1';const epBtn=document.createElement('button');epBtn.type='button';epBtn.className='sh-em-btn';epBtn.innerHTML='&#128515;';epBtn.style.cssText='background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:0 13px;cursor:pointer;font-size:1.05rem;touch-action:manipulation;flex-shrink:0;';const ep=document.createElement('div');ep.className='ep-pop sh-ep';ep.style.cssText='position:relative;top:0;width:100%;';epBtn.addEventListener('click',e=>{e.stopPropagation();ep.classList.toggle('open');if(ep.classList.contains('open')&&!ep.children.length){const g=document.createElement('div');g.className='ep-grid';EMOJIS.forEach(em=>{const b=document.createElement('div');b.className='ep-e';b.textContent=em;b.addEventListener('click',ex=>{ex.stopPropagation();inp.value+=em;inp.focus();ep.classList.remove('open');});g.appendChild(b);});ep.appendChild(g);}});tr.appendChild(inp);tr.appendChild(epBtn);form.appendChild(tr);form.appendChild(ep);const trow=document.createElement('div');trow.className='sh-r2';const ts=document.createElement('input');ts.type='time';ts.value=isEdit?(ev2.start||''):'';const te=document.createElement('input');te.type='time';te.value=isEdit?(ev2.end||''):'';trow.appendChild(ts);trow.appendChild(te);form.appendChild(trow);const tn=document.createElement('textarea');tn.placeholder='Note (optional)';tn.value=isEdit?(ev2.note||''):'';form.appendChild(tn);const repSel=document.createElement('select');['none','daily','weekly','monthly','yearly'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v==='none'?'No repeat':v.charAt(0).toUpperCase()+v.slice(1);if(isEdit&&ev2.repeat===v)o.selected=true;repSel.appendChild(o);});form.appendChild(repSel);const remSel=document.createElement('select');[{v:'none',t:'No reminder'},{v:'15min',t:'15 min before'},{v:'1hr',t:'1 hr before'},{v:'1day',t:'1 day before'},{v:'1week',t:'1 week before'},{v:'custom',t:'Custom time...'}].forEach(({v,t})=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(isEdit&&ev2.reminder===v)o.selected=true;remSel.appendChild(o);});form.appendChild(remSel);const remT=document.createElement('input');remT.type='time';remT.value=isEdit?(ev2.reminderTime||''):'';remT.style.display=(isEdit&&ev2.reminder==='custom')?'block':'none';remSel.addEventListener('change',()=>{remT.style.display=remSel.value==='custom'?'block':'none';});form.appendChild(remT);const cr=document.createElement('div');cr.className='sh-clr';const cl=document.createElement('div');cl.className='sh-clr-lbl';cl.textContent='Colour';cr.appendChild(cl);const curC=isEdit?(ev2.color||'red'):'red';SELC=curC;Object.entries(C).forEach(([k,v])=>{const sw=document.createElement('div');sw.className='sh-cs'+(k===curC?' on':'');sw.style.background=v.h;sw.dataset.c=k;sw.addEventListener('click',()=>{document.querySelectorAll('.sh-cs').forEach(s=>s.classList.remove('on'));sw.classList.add('on');SELC=k;});cr.appendChild(sw);});form.appendChild(cr);const btns=document.createElement('div');btns.className='sh-btns';if(isEdit){const canc=document.createElement('button');canc.type='button';canc.className='sh-cancel';canc.textContent='Cancel';canc.addEventListener('click',()=>{closeSheet();openSheet(y,m,d);});btns.appendChild(canc);}const sub=document.createElement('button');sub.type='button';sub.className='sh-save';sub.textContent=isEdit?'Save Changes':'+ Add Event';sub.addEventListener('click',()=>{const t=inp.value.trim();if(!t){alert('Please enter a title.');return;}if(!EV[key])EV[key]=[];const obj={title:t,start:ts.value,end:te.value,note:tn.value.trim(),color:SELC,repeat:repSel.value,reminder:remSel.value,reminderTime:remSel.value==='custom'?remT.value:''};if(isEdit){applyEdit(key,editIdx,obj);}else{saveEv(key,obj);storeRem(obj,key);}save();closeSheet();render();openSheet(y,m,d);});btns.appendChild(sub);form.appendChild(btns);body.appendChild(form);document.getElementById('shOv').classList.add('on');document.getElementById('sheet').classList.add('on');document.body.style.overflow='hidden';setTimeout(()=>{try{inp.focus();}catch(e){}},400);}
function closeSheet(){document.getElementById('shOv').classList.remove('on');document.getElementById('sheet').classList.remove('on');document.body.style.overflow='';}

// DESKTOP SIDEBAR
function renderSB(){if(!SEL)return;const{y,m,d}=SEL,key=fk(y,m,d),dayEvs=sortEvs(EV[key]||[]),list=document.getElementById('evList');list.innerHTML='';const hol=getHol(y,m,d);if(hol){const hn=document.createElement('div');hn.className='hdn';hn.textContent='🇳🇱 '+hol;list.appendChild(hn);}if(!dayEvs.length){const es=document.createElement('div');es.className='empty-s';es.textContent='No events — add one!';list.appendChild(es);return;}dayEvs.forEach(ev=>{const origIdx=EV[key].indexOf(ev);const cm=C[ev.color]||C.green;const item=document.createElement('div');item.className='ev-item';item.style.setProperty('--ec',cm.h);item.style.setProperty('--ecl',cm.l);const inf=document.createElement('div');inf.className='ev-inf';const tt=document.createElement('div');tt.className='ev-t';if(ev.recurId){const ri=document.createElement('span');ri.style.cssText='font-size:0.58rem;color:var(--blue);background:var(--blue-l);border-radius:3px;padding:1px 4px;margin-right:3px;';ri.textContent='↺';tt.appendChild(ri);}tt.appendChild(document.createTextNode(ev.title));const tm=document.createElement('div');tm.className='ev-tm';let ts=ev.start?(ev.end?ev.start+'-'+ev.end:ev.start):'All day';if(ev.note)ts+='  ·  '+ev.note;tm.textContent=ts;inf.appendChild(tt);inf.appendChild(tm);const bdg=document.createElement('div');bdg.className='ev-bdg';bdg.style.setProperty('--ec',cm.h);bdg.style.setProperty('--ecl',cm.l);bdg.textContent=cm.n;const acts=document.createElement('div');acts.className='ev-acts';const eb=document.createElement('button');eb.className='ev-ed';eb.textContent='Edit';eb.addEventListener('click',e=>{e.stopPropagation();startEdit(key,origIdx);});const db=document.createElement('button');db.className='ev-dl';db.innerHTML='&times;';db.addEventListener('click',e=>{e.stopPropagation();delEv(key,origIdx);});acts.appendChild(eb);acts.appendChild(db);item.appendChild(inf);item.appendChild(bdg);item.appendChild(acts);list.appendChild(item);});}
function startEdit(key,idx){const ev=EV[key][idx];EK=key;EI=idx;document.getElementById('eTitle').value=ev.title;document.getElementById('eStart').value=ev.start||'';document.getElementById('eEnd').value=ev.end||'';document.getElementById('eNote').value=ev.note||'';document.getElementById('eRep').value=ev.repeat||'none';document.getElementById('eRem').value=ev.reminder||'none';tRT(ev.reminder||'none','deskRT');document.getElementById('deskRT').value=ev.reminderTime||'';document.querySelectorAll('.csc').forEach(s=>s.classList.toggle('on',s.dataset.c===ev.color));SELC=ev.color||'green';document.getElementById('sbH').textContent='Edit Event';document.getElementById('editBan').style.display='block';document.getElementById('btnCN').style.display='block';document.getElementById('btnSV').textContent='Save Changes';document.getElementById('eTitle').focus();document.querySelector('.sb').scrollTop=0;}
function cancelEdit(){EK=null;EI=null;document.getElementById('sbH').textContent='Add Event';document.getElementById('editBan').style.display='none';document.getElementById('btnCN').style.display='none';document.getElementById('btnSV').textContent='+ Add Event';['eTitle','eStart','eEnd','eNote'].forEach(id=>document.getElementById(id).value='');document.getElementById('eRep').value='none';document.getElementById('eRem').value='none';tRT('none','deskRT');document.getElementById('deskRT').value='';}
function submitDesk(){
  if(EK!==null&&EI!==null){const t=document.getElementById('eTitle').value.trim();if(!t){alert('Enter a title.');return;}const rv=document.getElementById('eRem').value;applyEdit(EK,EI,{title:t,start:document.getElementById('eStart').value,end:document.getElementById('eEnd').value,note:document.getElementById('eNote').value.trim(),color:SELC,repeat:document.getElementById('eRep').value,reminder:rv,reminderTime:rv==='custom'?(document.getElementById('deskRT').value||''):''});save();cancelEdit();render();renderSB();return;}
  if(!SEL){alert('Select a day first.');return;}const t=document.getElementById('eTitle').value.trim();if(!t){alert('Enter a title.');return;}const key=fk(SEL.y,SEL.m,SEL.d),rv=document.getElementById('eRem').value;const obj={title:t,start:document.getElementById('eStart').value,end:document.getElementById('eEnd').value,note:document.getElementById('eNote').value.trim(),color:SELC,repeat:document.getElementById('eRep').value,reminder:rv,reminderTime:rv==='custom'?(document.getElementById('deskRT').value||''):''};saveEv(key,obj);storeRem(obj,key);save();cancelEdit();render();renderSB();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

(function(){const v=new URLSearchParams(location.search).get('view');
if(v&&['year','month','week','agenda','plan'].includes(v))VIEW=v;})();

loadFB().then(()=>{setView(VIEW);startSSE();initNotifs();loadWeather();});
